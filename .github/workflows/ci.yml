name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Auditoria de dependências (segurança)
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Teste de integração (docker compose)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Subir a stack completa
        run: docker compose up -d --build

      - name: Aguardar a API e testar
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/metrics > /dev/null && break
            sleep 2
          done
          curl -sf -X POST http://localhost:3000/contracts \
            -H "Content-Type: application/json" \
            -d '{"title":"Contrato CI","userId":"ci-user","description":"smoke test","value":100}'
          curl -sf http://localhost:3000/metrics | grep http_request_duration_ms
          curl -sf http://localhost:9090/-/ready

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publicar imagem no GHCR
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max